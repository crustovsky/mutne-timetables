name: Aktualizacja rozkładów

on:
  schedule:
    - cron: "37 0 * * *"   # codziennie 00:37 UTC, przed pierwszymi kursami (05:06). GitHub opóźnia cron o godziny, najbardziej o pełnych godzinach, stąd zapas i nietypowa minuta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pobierz i sparsuj rozkłady
        run: python3 scripts/update_timetables.py

      - name: Commit jeśli są zmiany
        run: |
          git config user.name "timetable-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizacja rozkładów $(date +%F)"
            git push
          fi
